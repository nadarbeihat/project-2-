
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Geometry | 02</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>CSS <span>GEOMETRY</span></h1>
    <p class="subtitle">FIVE SHAPES. PURE CSS.</p>

    <main class="shape-container">
        <div class="shape-card">
            <div class="square"></div>
            <p>01 / SQUARE</p>
        </div>

        <div class="shape-card">
            <div class="rectangle"></div>
            <p>02 / RECTANGLE</p>
        </div>

        <div class="shape-card">
            <div class="circle"></div>
            <p>03 / CIRCLE</p>
        </div>

        <div class="shape-card">
            <div class="pill"></div>
            <p>04 / CAPSULE</p>
        </div>

        <div class="shape-card">
            <div class="triangle"></div>
            <p>05 / TRIANGLE</p>
        </div>
    </main>

</body>
</html>
