<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Moon Phases Hover</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Moon Phases</h1>

  <h2>Cards</h2>
  <div class="card">
    <div class="icon">🌑</div>
    <h3>New Moon</h3>
  </div>
  <div class="card">
    <div class="icon">🌓</div>
    <h3>First Quarter</h3>
  </div>
  <div class="card">
    <div class="icon">🌕</div>
    <h3>Full Moon</h3>
  </div>
  <div class="card">
    <div class="icon">🌗</div>
    <h3>Last Quarter</h3>
  </div>

  <h2>Buttons</h2>
  <button class="button">Waxing</button>
  <button class="button">Waning</button>

</body>
</html>
